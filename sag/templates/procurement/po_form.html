<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
{% extends "procurement/base_procurement.html" %}
{% load crispy_forms_tags %}

{% block procurement_child %}

<div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 700px;">
        <h3 class="mb-4">Create Purchase Order</h3>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="mt-3 d-flex justify-content-end">
                <a href="{% url 'procurement:po_list' %}" class="btn btn-secondary me-2">Back</a>
                <button class="btn btn-primary" type="submit">Create PO</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
