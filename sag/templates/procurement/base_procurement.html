{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Procurement{% endblock %}</title>

    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        :root { --sidebar-width: 260px; }

        body { background: #f5f6fa; margin: 0; padding: 0; }

        /* Sidebar */
        #procurement-sidebar {
            width: var(--sidebar-width);
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            background: #102542;
            padding: 15px;
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* Scrollable area */
        .menu-scroll {
            margin-top: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
            padding-right: 6px;
        }

        .menu-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .menu-scroll::-webkit-scrollbar-thumb {
            background: #3a4e7a;
            border-radius: 10px;
        }

        .menu-section-title {
            color: #8fbff9;
            font-size: 12px;
            margin-top: 15px;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: .5px;
        }

        #procurement-sidebar .nav-link {
            color: #ffffffc7;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        #procurement-sidebar .nav-link:hover,
        #procurement-sidebar .nav-link.active {
            background: #3f7bd3;
            color: white;
        }

        .procurement-content {
            margin-left: var(--sidebar-width);
            padding: 25px;
        }
    </style>
</head>

<body>

<div id="procurement-sidebar">

    <h4 class="text-center mb-3">Procurement</h4>

    <div class="menu-scroll">
        <nav class="nav flex-column">

            <!-- Back -->
            <a class="nav-link" href="{% url 'dashboard' %}">
                ← Back to Dashboard
            </a>

            <!-- Dashboard -->
            <a class="nav-link {% if request.resolver_match.url_name == 'procurement_index' %}active{% endif %}"
               href="{% url 'procurement:procurement_index' %}">
                Procurement Dashboard
            </a>

            <!-- Purchase Requests -->
            <div class="menu-section-title">Purchase Requests</div>

            <a class="nav-link {% if request.resolver_match.url_name == 'pr_create' %}active{% endif %}" 
               href="{% url 'procurement:pr_create' %}">
                Create Request
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'pr_list' %}active{% endif %}" 
               href="{% url 'procurement:pr_list' %}">
                Request List
            </a>

            <!-- Purchase Orders -->
            <div class="menu-section-title">Purchase Orders</div>

            <a class="nav-link {% if request.resolver_match.url_name == 'po_create' %}active{% endif %}" 
               href="{% url 'procurement:po_create' %}">
                Create PO
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'po_list' %}active{% endif %}" 
               href="{% url 'procurement:po_list' %}">
                PO List
            </a>

            <!-- GRN -->
            <div class="menu-section-title">Goods Received</div>

            <a class="nav-link {% if request.resolver_match.url_name == 'grn_create' %}active{% endif %}" 
               href="{% url 'procurement:grn_create' %}">
                Create GRN
            </a>

            <a class="nav-link {% if request.resolver_match.url_name == 'grn_list' %}active{% endif %}" 
               href="{% url 'procurement:grn_list' %}">
                GRN List
            </a>

        </nav>
    </div>

</div>

<div class="procurement-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
