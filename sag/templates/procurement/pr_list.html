

{% extends "procurement/base_procurement.html" %}
{% block content %}
<h3>Purchase Requests</h3>
<p><a class="btn btn-primary btn-sm" href="{% url 'procurement:pr_create' %}">Create PR</a></p>
<table class="table">
  <thead><tr><th>#</th><th>Title</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
  <tbody>
    {% for pr in prs %}
      <tr>
        <td>{{ pr.pk }}</td>
        <td>{{ pr.title }}</td>
        <td>{{ pr.get_status_display }}</td>
        <td>{{ pr.created_at|date:"Y-m-d H:i" }}</td>
        <td><a href="{% url 'procurement:pr_detail' pr.pk %}" class="btn btn-sm btn-outline-primary">View</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No PRs yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
