{% extends 'core/dashboard.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

{% if messages %}
<div class="d-flex justify-content-center mt-3">
    <div style="width: 100%; max-width: 800px;">
        {% for message in messages %}
            <div class="alert alert-success d-flex align-items-center shadow-sm border-0" role="alert" style="background-color: #d1e7dd; color: #0f5132; border-radius: 8px; padding: 15px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-check-circle-fill me-3" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
                <div>
                    {{ message }}
                </div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
</div>
{% endif %}

<div class="child-content">
    <div class="d-flex justify-content-center">
        <div class="card shadow-sm custom-po-card">
            <div class="card-body p-5">
                <h2 class="card-title h3 mb-4">Create Purchase Request</h2>

                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    
                    <div class="form-container">
                        {{ form|crispy }}
                    </div>

                    <div class="mt-5 d-flex justify-content-end gap-2">
                        <!-- <a href="{% url 'procurement:pr_list' %}" class="btn btn-back">Back</a> -->
                        <button class="btn btn-create" type="submit">Create Purchase Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* 1. Header Styling from your code */
    .header-buttons-container {
        padding: 12px 18px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid #e0e0e0;
    }
    .header-underline {
        margin-top: 10px;
        height: 2px;
        background-color: #e0e0e0;
        width: 100%;
    }
    .child-content {
        width: 100%;
        padding: 40px 0;
        background-color: #f8f9fa; /* Light background to make card pop */
    }

    /* 2. Card Styling matching the image */
    .custom-po-card {
        width: 100%;
        max-width: 800px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        background-color: #ffffff;
    }

    .card-title {
        color: #333;
        font-weight: 500;
    }

    /* 3. Form Input Styling */
    .form-container .form-control, 
    .form-container .form-select {
        border-radius: 6px;
        border: 1px solid #ced4da;
        padding: 10px;
        margin-bottom: 15px;
    }

    /* 4. Button Styles matching the image colors */
    .btn-back {
        background-color: #6c757d;
        color: white;
        padding: 8px 25px;
        border-radius: 6px;
        border: none;
    }
    .btn-back:hover {
        background-color: #5a6268;
        color: white;
    }

    .btn-create {
        background-color: #007bff;
        color: white;
        padding: 8px 25px;
        border-radius: 6px;
        border: none;
    }
    .btn-create:hover {
        background-color: #0069d9;
        color: white;
    }

    /* Remove default focus rings for a cleaner look */
    .form-control:focus, .btn:focus {
        box-shadow: none;
        border-color: #007bff;
    }
</style>
{% endblock content %}
