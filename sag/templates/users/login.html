<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Font Setup (Inter) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom background gradient for aesthetics */
        .bg-login-gradient {
            background: linear-gradient(135deg, #1f2937, #111827);
        }
    </style>
</head>
<body class="bg-login-gradient min-h-screen flex items-center justify-center p-4">

    <!-- Login Card Container -->
    <div class="w-full max-w-md bg-white shadow-2xl rounded-xl p-8 md:p-10 transition-all duration-300">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Welcome Back!</h1>
            <p class="text-gray-500">Sign in to access your dashboard.</p>
        </div>

        <!-- Django Messages Display -->
        {% for message in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm text-center 
                        {% if message.tags == 'error' %} bg-red-100 text-red-700 
                        {% elif message.tags == 'success' %} bg-green-100 text-green-700 
                        {% else %} bg-yellow-100 text-yellow-700 
                        {% endif %}" role="alert">
                {{ message }}
            </div>
        {% endfor %}

        <!-- Login Form -->
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username" 
                    placeholder="Enter your username" 
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150"
                >
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150"
                >
            </div>

            <!-- Login Button -->
            <button 
                type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg 
                       text-base font-semibold text-white bg-indigo-600 
                       hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 
                       transition duration-200 transform hover:scale-[1.01] active:scale-100"
            >
                Login
            </button>
        </form>

        <!-- Footer Link (Optional) -->
        <!-- <div class="mt-6 text-center">
            <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition duration-150">
                Forgot your password?
            </a>
        </div> -->
    </div>

</body>
</html>
