
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Dashboard</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }
        #sidebar .nav-link {
            color: white;
        }
        #sidebar .nav-link.active {
            background-color: #3f5feaff;
            border-radius: 0.375rem;
        }
        #sidebar .nav-link:hover {
            background-color: #3f5feaff;
            border-radius: 0.375rem;
        }
        #content {
            padding: 2rem;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        
        <div id="sidebar" class="text-white p-3 d-flex flex-column align-items-center" style="width: 250px; background-color: #141135ff;">
            <img src="{% static 'images/logo.jpg' %}" alt="Company Logo" class="rounded-circle mb-2" style="width: 100px; height: 100px; object-fit: cover;">
            <h4 class="text-center mb-4">Saud Aluminium & Glass</h4>
            <h6>Inventory</h6>
            <nav class="nav flex-column w-100">
                <a href="{% url 'add_supplier' %}" class="nav-link px-3 py-2 {% if request.path == '/inventory/add_supplier/' %}active{% endif %}">Add Supplier</a>
                <a href="{% url 'add_raw_material' %}" class="nav-link px-3 py-2 {% if request.path == '/inventory/add_raw_material/' %}active{% endif %}">Add Raw Material</a>
                <a href="{% url 'add_warehouse' %}" class="nav-link px-3 py-2 {% if request.path == '/inventory/add_warehouse/' %}active{% endif %}">Add Warehouse</a>
                <a href="{% url 'stock_movement' %}" class="nav-link px-3 py-2 {% if request.path == '/inventory/stock_movement/' %}active{% endif %}">Stock Movement</a>
                <a href="{% url 'add_inventory_batch' %}" class="nav-link px-3 py-2 {% if request.path == '/inventory/add_inventory_batch/' %}active{% endif %}">Add Inventory Batch</a>
            </nav>
        </div>

        
        <div id="content" class="flex-fill">
            {% block content %}
            
            {% endblock %}
        </div>
    </div>
</body>
</html>
