<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

{% extends 'inventory/inventory_base.html' %}
{% load crispy_forms_tags %}

{% block inventory_child %}

<div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 700px;">
        <h3 class="mb-4">Add Raw Material</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="mt-3 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <a href="{% url 'inventory:material_list' %}" class="btn btn-secondary">Back</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
