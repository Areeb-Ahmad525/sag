{% extends 'inventory/base_inventory.html' %}
{% load crispy_forms_tags %}

{% block title %}Record Stock Movement{% endblock %}

{% block content %}
<div class="container mt-3">
    <div class="card p-4 shadow">
        <h3>Record New Stock Movement</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary mt-3">Save Movement</button>
        </form>
    </div>
</div>
{% endblock %}
