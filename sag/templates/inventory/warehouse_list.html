<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
{% extends 'inventory/inventory_base.html' %}
{% load static %}

{% block inventory_child %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- ================= PAGE HEADER ================= -->
<div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Warehouses</h3>

    <a href="/inventory/warehouses/create/" class="btn btn-success btn-sm ms-2">
        <i class="bi bi-plus-circle me-1"></i> Add Warehouse
    </a>
</div>

<!-- ================= WAREHOUSE TABLE ================= -->
<table class="table table-bordered table-striped align-middle">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Location</th>
            <th style="width: 200px;">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for w in warehouses %}
        <tr>
            <td class="fw-semibold">{{ w.name }}</td>
            <td>{{ w.location }}</td>

            <td>
                <!-- EDIT -->
                <a href="{% url 'inventory:edit_warehouse' w.id %}"
                   class="btn btn-sm btn-warning me-1">
                    Edit
                </a>

                <!-- DELETE -->
                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteConfirmModal"
                    data-delete-url="{% url 'inventory:delete_warehouse' w.id %}"
                    data-object-name="Warehouse {{ w.id }}">
                    Delete
                </button>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="3" class="text-center text-muted py-4">
                No warehouses found
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
