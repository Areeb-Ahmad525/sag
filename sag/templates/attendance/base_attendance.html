{% extends 'core/dashboard.html' %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
{% load static %}

{% block content %}

<div class="header-buttons-container">
    <div class="header-buttons">

        <a href="{% url 'attendance:attendance_list' %}"
           class="header-btn {% if request.resolver_match.url_name == 'list' %}active{% endif %}">
            Attendance List
        </a>

        <a href="{% url 'attendance:mark' %}"
           class="header-btn {% if request.resolver_match.url_name == 'mark' %}active{% endif %}">
            Mark Attendance
        </a>

        <a href="{% url 'attendance:report' %}"
           class="header-btn {% if request.resolver_match.url_name == 'report' %}active{% endif %}">
            Attendance Report
        </a>

    </div>
    <div class="header-underline"></div>
</div>

<div class="child-content">
    {% block attendance_child %}{% endblock %}
</div>

<style>
.header-buttons-container {
    padding: 12px 18px;
    background-color: #fff;
    border-bottom: 1px solid #e0e0e0;
}
.header-buttons {
    display: flex;
    gap: 10px;
}
.header-btn {
    padding: 5px 15px;
    border: 2px solid #0d6efd;
    border-radius: 50px;
    background: transparent;
    color: #0d6efd;
    text-decoration: none;
}
.header-btn.active {
    background: #0d6efd;
    color: #fff;
}
.child-content {
    padding: 20px;
}
</style>

{% endblock %}
