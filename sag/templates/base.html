{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Saud Aluminium and Glass{% endblock %}</title>
    
    <!-- FAVICON: Add this line to set the company logo as the tab icon -->
    <link rel="icon" type="image/jpg" href="{% static 'images/logo.jpg' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'header.html' %}
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    {% include 'footer.html' %}
    
    <script src="{% static 'js/script.js' %}" async defer></script>
</body>
</html>
