{% extends "management_base.html" %}
{% block content %}
<h3>Work Orders</h3>
<table class="table table-striped">
  <thead><tr><th>WO#</th><th>Product</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody>
    {% for wo in wos %}
      <tr>
        <td>{{ wo.work_order_number }}</td>
        <td>{{ wo.product }}</td>
        <td>{{ wo.quantity_to_produce }}</td>
        <td>{{ wo.status }}</td>
        <td>
          <a href="{% url 'production:wo_detail' wo.id %}" class="btn btn-sm btn-outline-primary">View</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No work orders yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
