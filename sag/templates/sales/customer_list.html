{% extends 'sales/base_sales.html' %}
{% block sales_child %}


<div class="page-header">
<h3>Customers</h3>
<a href="{% url 'sales:customer_create' %}" class="btn btn-primary">+ New Customer</a>
</div>


<table class="data-table">
<thead>
<tr>
<th>Name</th><th>Phone</th><th>Status</th><th>Actions</th>
</tr>
</thead>
<tbody>
{% for c in customers %}
<tr>
<td>{{ c.name }}</td>
<td>{{ c.phone }}</td>
<td>{{ c.status|title }}</td>
<td class="actions">
<a href="{% url 'sales:customer_update' c.pk %}" class="btn-edit">Edit</a>
<a href="{% url 'sales:customer_delete' c.pk %}" class="btn-delete">Delete</a>
<a href="{% url 'sales:quotation_create' %}?customer={{ c.pk }}" class="btn-secondary">Create Quotation</a>
</td>
</tr>
{% empty %}
<tr><td colspan="4">No customers found</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
