<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

{% extends "sales/base_sales.html" %}
{% load crispy_forms_tags %}

{% block sales_child %}

<div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 700px;">
        <h3 class="mb-4">{% if form.instance.pk %}Edit Customer Details{% else %}Add Customer{% endif %}</h3>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            

            <div class="mt-3 d-flex justify-content-end">
                <a href="{% url 'sales:customer_list'  %}" class="btn btn-secondary me-2">Back</a>
                <button class="btn btn-primary" type="submit">
                    {% if form.instance.pk %}Update{% else %}Add{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
