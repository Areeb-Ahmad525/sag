{% extends 'sales/base_sales.html' %}
{% load static %}
{% block sales_child %}

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
/* PAGE */
.delete-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fff5f5, #ffffff);
}

/* CARD */
.delete-card {
    max-width: 520px;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.14);
    animation: fadeScale 0.25s ease;
}

/* HEADER */
.delete-card .card-header {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    padding: 22px;
}

/* BODY */
.delete-body {
    padding: 40px 32px 32px;
    text-align: center;
}

/* ICON */
.delete-icon {
    font-size: 64px;
    color: #ef4444;
    margin-bottom: 24px;
}

/* TEXT */
.delete-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
}

.delete-object {
    font-size: 18px;
    font-weight: 700;
    color: #dc2626;
    margin-bottom: 14px;
}

.delete-warning {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 32px;
}

/* BUTTONS */
.delete-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
}

.delete-actions .btn {
    min-width: 140px;
    padding: 12px 22px;
    font-weight: 600;
    border-radius: 10px;
}

/* CANCEL */
.btn-cancel {
    background: #f3f4f6;
    color: #111827;
}
.btn-cancel:hover {
    background: #e5e7eb;
}

/* DELETE */
.btn-delete {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: none;
}
.btn-delete:hover {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
}

/* ANIMATION */
@keyframes fadeScale {
    from {
        opacity: 0;
        transform: scale(0.96);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>

<div class="delete-wrapper">
    <div class="card delete-card border-0">

        <!-- HEADER -->
        <div class="card-header text-white text-center">
            <h4 class="mb-0">Confirm Deletion</h4>
        </div>

        <!-- BODY -->
        <div class="delete-body">

            <i class="bi bi-exclamation-triangle-fill delete-icon"></i>

            <div class="delete-title">
                Are you sure you want to delete?
            </div>

            <div class="delete-object">
                Quotation #{{ object.pk }}
            </div>

            <div class="delete-warning">
                This action cannot be undone.
            </div>

            <form method="post" class="delete-actions">
                {% csrf_token %}

                <a href="{% url 'sales:quotation_list' %}"
                   class="btn btn-cancel">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-delete text-white">
                    Yes, Delete
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
