{% extends "management_base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Add Inventory Batch{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="mb-4">Add New Inventory Batch</h3>
    <form method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="mt-3 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary me-2">Save</button>
        <a href="{% url 'inventory_index' %}" class="btn btn-secondary">Back</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
